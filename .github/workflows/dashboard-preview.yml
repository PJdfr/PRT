name: Dashboard preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: |
          uv sync --extra dev --extra dashboard
          uv pip install playwright
          uv run playwright install --with-deps chromium
      - name: Build demo environment (mock data, full universe)
        run: uv run python scripts/demo_env.py --db demo.db
      - name: Launch dashboard
        run: |
          uv run streamlit run prt/dashboard/app.py --server.headless true --server.port 8501 -- --db demo.db &
          for i in $(seq 1 90); do curl -s -o /dev/null http://localhost:8501 && break; sleep 1; done
      - name: Screenshot every tab
        run: uv run python scripts/screenshot_dashboard.py
      - name: Commit screenshots to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Add dashboard preview screenshots [skip ci]" || echo "nothing to commit"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: docs/screenshots
