#   g1/g2 = unadjusted generics 1 & 2 (futures term-structure carry)
#   spot = spot series (fx only: notional conversion + carry vs CR)
#   pv   = point value (contract multiplier, in local ccy per price point)
#   cost_bps = half-spread cost estimate per trade, bps of notional
