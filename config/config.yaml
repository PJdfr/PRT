# =====================================================================
# PRT configuration — single source of truth for conventions & universe
# =====================================================================
# NOTE: Bloomberg tickers, roll-spec syntax (R:03_0_R = roll 3 days before
# expiry, ratio backward adjustment) and settlement times are best-effort
# and MUST be validated on the terminal before live use.

fund:
  capital_usd: 100_000_000
  target_vol: 0.10            # annualised fund vol target
  forecast_cap: 5.0           # forecasts live in [-5, +5]
  forecast_avg: 2.5           # expected average |forecast|
  idm: 1.5                    # instrument diversification multiplier
  vol_ewma_span: 32           # span (days) of EWMA vol estimate
  buffer_fraction: 0.10       # no-trade buffer, as fraction of average position size
  publish_lag_minutes: 10     # settle price assumed known N min after settle time
  decision_margin_minutes: 10 # we decide N min before the close we execute at

data:
  history_start: "2005-01-01"
  # Daily ingestion batch (UTC).  knowledge_ts = max(event_ts + publish_lag,
  # batch time of that day): data is only "known" once OUR system has it.
  daily_batch_utc: "22:30"
  checksum_points: 20         # trailing points compared to detect silent re-adjustment

signals:
  # 12 one-month (21d) Sharpe sub-signals, weighted by their own rolling
  # n-year subsystem Sharpe (clipped at 0, normalised)
  momentum: {weight: 1.0, n_years: 10}
  carry:    {weight: 1.0}
  # calendar-day Sharpe profile over the past n complete years, averaged
  # over centred windows [min_window..max_window]; per-year detrended,
  # GARCH(1,1)-standardised returns; Feb 29 merged into Feb 28
  seaso:    {weight: 1.0, n_years: 10, min_window: 10, max_window: 30}

# ---------------------------------------------------------------------
# Exchange groups: IANA timezone + local settlement time (verify on terminal)
# ---------------------------------------------------------------------
exchanges:
  us_rates:      {tz: America/Chicago,  settle_time: "14:00"}
  cme_equity:    {tz: America/Chicago,  settle_time: "15:00"}
  cbot_agri:     {tz: America/Chicago,  settle_time: "13:20"}
  cme_livestock: {tz: America/Chicago,  settle_time: "13:05"}
  nymex_energy:  {tz: America/New_York, settle_time: "14:30"}
  comex_metals:  {tz: America/New_York, settle_time: "13:30"}
  ice_softs:     {tz: America/New_York, settle_time: "13:30"}
  eurex_rates:   {tz: Europe/Berlin,    settle_time: "17:15"}
  eurex_equity:  {tz: Europe/Berlin,    settle_time: "17:30"}
  ice_gilt:      {tz: Europe/London,    settle_time: "16:15"}
  ice_ftse:      {tz: Europe/London,    settle_time: "16:35"}
  ice_gasoil:    {tz: Europe/London,    settle_time: "16:30"}
  jpx:           {tz: Asia/Tokyo,       settle_time: "15:15"}
  asx:           {tz: Australia/Sydney, settle_time: "16:30"}
  mx_rates:      {tz: America/Toronto,  settle_time: "15:00"}
  tsx_equity:    {tz: America/Toronto,  settle_time: "16:15"}
  fx_ny:         {tz: America/New_York, settle_time: "17:00"}
  crypto_ref:    {tz: Europe/London,    settle_time: "16:00"}

# ---------------------------------------------------------------------
# Currency -> USD conversion (via the spot series of the FX instruments)
# ---------------------------------------------------------------------
fx_conversion:
  EUR: {pair: EURUSD, invert: false}
  GBP: {pair: GBPUSD, invert: false}
  AUD: {pair: AUDUSD, invert: false}
  NZD: {pair: NZDUSD, invert: false}
  JPY: {pair: USDJPY, invert: true}
  CHF: {pair: USDCHF, invert: true}
  CAD: {pair: USDCAD, invert: true}
  SEK: {pair: USDSEK, invert: true}
  NOK: {pair: USDNOK, invert: true}

# ---------------------------------------------------------------------
